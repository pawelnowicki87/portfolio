<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:24px 28px;display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .label{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase;min-width:54px;}
  .meta{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);margin-left:auto;}
</style></head>
<body><div class="stage">
  <div class="row">
    <span class="label">D1 / 80</span>
    <span style="font-size:80px;font-weight:800;line-height:1;letter-spacing:-0.04em;">Ship it.</span>
    <span class="meta">800 · -0.04em</span>
  </div>
  <div class="row">
    <span class="label">D2 / 64</span>
    <span style="font-size:64px;font-weight:700;line-height:1;letter-spacing:-0.04em;">Build faster than yesterday</span>
    <span class="meta">700 · -0.04em</span>
  </div>
</div></body></html>
