<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 24px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:14px;}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);min-width:34px;text-align:right;}
  .bar{height:14px;background:var(--blue-500);border-radius:2px;}
  .px{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);margin-left:auto;}
</style></head>
<body><div class="stage">
  <div class="row"><span class="lbl">1</span><div class="bar" style="width:4px;"></div><span class="px">4 · hairline gap</span></div>
  <div class="row"><span class="lbl">2</span><div class="bar" style="width:8px;"></div><span class="px">8 · inline gap</span></div>
  <div class="row"><span class="lbl">3</span><div class="bar" style="width:12px;"></div><span class="px">12 · row gap</span></div>
  <div class="row"><span class="lbl">4</span><div class="bar" style="width:16px;"></div><span class="px">16 · field gap</span></div>
  <div class="row"><span class="lbl">6</span><div class="bar" style="width:24px;"></div><span class="px">24 · card pad</span></div>
  <div class="row"><span class="lbl">7</span><div class="bar" style="width:32px;"></div><span class="px">32 · section</span></div>
  <div class="row"><span class="lbl">9</span><div class="bar" style="width:48px;"></div><span class="px">48 · group</span></div>
  <div class="row"><span class="lbl">10</span><div class="bar" style="width:64px;"></div><span class="px">64 · block</span></div>
  <div class="row"><span class="lbl">12</span><div class="bar" style="width:96px;"></div><span class="px">96 · hero</span></div>
</div></body></html>
