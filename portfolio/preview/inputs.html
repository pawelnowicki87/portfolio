<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;}
  label{font-family:var(--font-sans);font-size:12px;font-weight:500;color:var(--fg-secondary);}
  .input{height:34px;padding:0 12px;background:var(--bg-sunken);border:1px solid var(--border-strong);border-radius:var(--radius-sm);color:var(--fg-primary);font-family:var(--font-sans);font-size:13px;outline:none;}
  .input.focus{border-color:var(--border-focus);box-shadow:var(--ring-focus);}
  .input.err{border-color:var(--red-500);box-shadow:var(--ring-error);}
  .hint{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);}
  .err-msg{font-size:11px;color:var(--red-400);}
  .select{position:relative;}
  .select svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;color:var(--fg-tertiary);}
  textarea.input{height:auto;padding:10px 12px;resize:none;}
</style></head>
<body><div class="stage">
  <div class="row">
    <div class="field"><label>Name</label><input class="input" value="Paweł Nowicki"/></div>
    <div class="field"><label>Email</label><input class="input focus" value="webstardevelop@gmail.com"/></div>
    <div class="field"><label>Role</label><div class="select"><input class="input" value="Engineer" style="padding-right:28px;"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div></div>
  </div>
  <div class="row">
    <div class="field"><label>Project key</label><input class="input err" value="PMP@!"/><span class="err-msg">Letters, digits, dashes only.</span></div>
    <div class="field" style="flex:2;"><label>Description</label><textarea class="input" rows="2">Senior full-stack engineering — React, NestJS, AWS.</textarea></div>
  </div>
</div></body></html>
