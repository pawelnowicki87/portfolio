<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:30px 24px;display:flex;align-items:center;justify-content:space-around;gap:14px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .card{width:80px;height:64px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .lbl b{color:var(--fg-primary);font-weight:600;}
</style></head>
<body><div class="stage">
  <div class="item"><div class="card" style="box-shadow:var(--shadow-xs);"></div><div class="lbl"><b>xs</b> · resting</div></div>
  <div class="item"><div class="card" style="box-shadow:var(--shadow-sm);"></div><div class="lbl"><b>sm</b> · cards</div></div>
  <div class="item"><div class="card" style="box-shadow:var(--shadow-md);"></div><div class="lbl"><b>md</b> · menus</div></div>
  <div class="item"><div class="card" style="box-shadow:var(--shadow-lg);"></div><div class="lbl"><b>lg</b> · modals</div></div>
  <div class="item"><div class="card" style="box-shadow:var(--shadow-xl);"></div><div class="lbl"><b>xl</b> · dialogs</div></div>
</div></body></html>
