<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 24px;display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .b{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:9999px;font-size:11.5px;font-weight:500;font-family:var(--font-sans);border:1px solid transparent;line-height:1.6;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .s-info  {background:var(--status-info-bg);color:var(--status-info-fg);}
  .s-ok    {background:var(--status-success-bg);color:var(--status-success-fg);}
  .s-warn  {background:var(--status-warning-bg);color:var(--status-warning-fg);}
  .s-err   {background:var(--status-danger-bg);color:var(--status-danger-fg);}
  .s-neut  {background:#232831;color:var(--fg-secondary);border-color:var(--border-default);}
  .tag     {background:transparent;color:var(--fg-secondary);border-color:var(--border-default);font-family:var(--font-mono);font-size:10.5px;padding:2px 8px;border-radius:var(--radius-xs);}
</style></head>
<body><div class="stage">
  <div class="row">
    <span class="b s-info"><span class="dot" style="background:#5B8DFF;"></span>In progress</span>
    <span class="b s-ok"><span class="dot" style="background:#34D399;"></span>Deployed</span>
    <span class="b s-warn"><span class="dot" style="background:#FBBF24;"></span>Pending review</span>
    <span class="b s-err"><span class="dot" style="background:#F87171;"></span>Failed</span>
    <span class="b s-neut"><span class="dot" style="background:#6C7689;"></span>Archived</span>
    <span class="b s-info">Beta</span>
    <span class="b s-ok">v2.4.1</span>
  </div>
  <div class="row">
    <span class="b tag">react</span>
    <span class="b tag">typescript</span>
    <span class="b tag">nestjs</span>
    <span class="b tag">postgres</span>
    <span class="b tag">aws</span>
    <span class="b tag">redis</span>
    <span class="b tag">rabbitmq</span>
  </div>
</div></body></html>
