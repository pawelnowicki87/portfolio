<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 24px;display:flex;gap:14px;}
  .card{flex:1;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;}
  .card.hov{border-color:var(--border-strong);box-shadow:var(--shadow-md);}
  .head{display:flex;align-items:center;justify-content:space-between;}
  .title{font-size:13px;font-weight:600;color:var(--fg-primary);}
  .meta{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);}
  .stat{font-size:32px;font-weight:700;letter-spacing:-0.02em;color:var(--fg-primary);font-variant-numeric:tabular-nums;}
  .delta{font-size:12px;color:var(--status-success-fg);display:flex;align-items:center;gap:4px;}
  .delta.down{color:var(--status-danger-fg);}
  .progress{height:4px;background:var(--bg-sunken);border-radius:9999px;overflow:hidden;}
  .progress > div{height:100%;background:var(--blue-500);border-radius:9999px;}
  .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg-secondary);}
  svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style></head>
<body><div class="stage">
  <div class="card">
    <div class="head"><span class="title">Active users</span><span class="meta">24h</span></div>
    <div class="stat">12,481</div>
    <div class="delta"><svg viewBox="0 0 24 24"><path d="m7 17 5-5 5 5M7 7l5-5 5 5"/></svg>+8.2%</div>
  </div>
  <div class="card hov">
    <div class="head"><span class="title">Hematobieg</span><span class="meta">project</span></div>
    <div class="row"><span>Sprint 14</span><span style="color:var(--fg-tertiary);">68%</span></div>
    <div class="progress"><div style="width:68%"></div></div>
    <div class="row" style="margin-top:auto;"><span>3 open issues</span><span style="color:var(--status-success-fg);">on track</span></div>
  </div>
  <div class="card">
    <div class="head"><span class="title">Conversion</span><span class="meta">7d</span></div>
    <div class="stat">3.42%</div>
    <div class="delta down"><svg viewBox="0 0 24 24"><path d="m17 7-5 5-5-5m10 10-5 5-5-5"/></svg>−0.4%</div>
  </div>
</div></body></html>
