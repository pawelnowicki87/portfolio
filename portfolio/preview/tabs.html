<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:26px 24px;display:flex;flex-direction:column;gap:16px;}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-subtle);}
  .tab{font-size:13px;font-weight:500;color:var(--fg-secondary);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;}
  .tab.active{color:var(--fg-primary);border-bottom-color:var(--blue-500);}
  .tab:hover:not(.active){color:var(--fg-primary);}
  .count{font-family:var(--font-mono);font-size:10.5px;background:var(--bg-sunken);padding:1px 6px;border-radius:9999px;color:var(--fg-tertiary);}
  .active .count{color:var(--fg-brand);background:rgba(59,130,246,.12);}
  .segmented{display:inline-flex;background:var(--bg-sunken);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:2px;align-self:flex-start;}
  .seg{font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;color:var(--fg-secondary);cursor:pointer;}
  .seg.on{background:var(--bg-elevated);color:var(--fg-primary);box-shadow:var(--shadow-xs);}
</style></head>
<body><div class="stage">
  <div class="tabs">
    <div class="tab active">Overview <span class="count">12</span></div>
    <div class="tab">Issues <span class="count">3</span></div>
    <div class="tab">Pull requests</div>
    <div class="tab">Deployments</div>
    <div class="tab">Settings</div>
  </div>
  <div class="segmented">
    <div class="seg on">Day</div>
    <div class="seg">Week</div>
    <div class="seg">Month</div>
    <div class="seg">Quarter</div>
  </div>
</div></body></html>
