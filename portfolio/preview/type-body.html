<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 28px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .label{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase;min-width:64px;}
  .meta{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);margin-left:auto;}
  p{margin:0;max-width:480px;}
</style></head>
<body><div class="stage">
  <div class="row"><span class="label">Lead 18</span><p style="font-size:18px;line-height:1.65;color:var(--fg-secondary);">I build scalable enterprise web applications.</p><span class="meta">400 · 1.65</span></div>
  <div class="row"><span class="label">Body 14</span><p style="font-size:14px;line-height:1.65;">React, Node.js, NestJS, TypeScript — every project gets the same care for performance and accessibility.</p><span class="meta">400 · 1.65</span></div>
  <div class="row"><span class="label">Small 13</span><p style="font-size:13px;color:var(--fg-secondary);">Last updated 3 minutes ago</p><span class="meta">400 · secondary</span></div>
  <div class="row"><span class="label">Caption 12</span><p style="font-size:12px;color:var(--fg-tertiary);">UTC+1 · Wrocław, Poland</p><span class="meta">400 · tertiary</span></div>
</div></body></html>
