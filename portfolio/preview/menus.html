<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:24px 24px;display:flex;gap:18px;align-items:flex-start;}
  .menu{width:240px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:6px;box-shadow:var(--shadow-md);}
  .item{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:13px;color:var(--fg-primary);border-radius:var(--radius-sm);cursor:pointer;}
  .item:hover{background:var(--action-ghost-bg-hover);}
  .item.danger{color:var(--status-danger-fg);}
  .item .k{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);background:var(--bg-sunken);padding:1px 5px;border-radius:4px;}
  .sep{height:1px;background:var(--border-subtle);margin:5px 4px;}
  .head{font-family:var(--font-mono);font-size:10px;color:var(--fg-tertiary);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.06em;}
  svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;color:var(--fg-tertiary);}
  .item:hover svg{color:var(--fg-primary);}
</style></head>
<body><div class="stage">
  <div class="menu">
    <div class="head">Project</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M4 4h6l2 3h8v12H4z"/></svg>Open project <span class="k">⌘O</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New file <span class="k">⌘N</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>Move to…</div>
    <div class="sep"></div>
    <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Recent activity</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 1 1-9.5-8.3"/><path d="m21 4-9 9-3-3"/></svg>Mark as done</div>
    <div class="sep"></div>
    <div class="item danger"><svg viewBox="0 0 24 24" style="color:currentColor;"><path d="M3 6h18M8 6V4h8v2m-7 4v8m6-8v8M5 6l1 14h12l1-14"/></svg>Delete project</div>
  </div>
  <div style="flex:1;font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);padding-top:8px;">Context menu · keyboard shortcuts right-aligned · destructive at bottom</div>
</div></body></html>
