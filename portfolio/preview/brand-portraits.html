<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:20px 24px;display:flex;gap:18px;align-items:center;}
  .frame{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-default);}
  .a{width:120px;height:120px;background:radial-gradient(circle at 30% 25%, rgba(59,130,246,.45), transparent 60%), #0E1117;}
  .a img{width:100%;height:100%;object-fit:cover;mix-blend-mode:normal;}
  .b{width:160px;height:120px;}
  .b img{width:100%;height:100%;object-fit:cover;}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);}
  .stack{display:flex;flex-direction:column;gap:4px;}
  .stack b{font-size:13px;color:var(--fg-primary);font-family:var(--font-sans);font-weight:600;}
</style></head>
<body><div class="stage">
  <div class="frame a"><img src="../assets/founder-portrait.png" alt="Paweł Nowicki"/></div>
  <div class="stack"><b>Hero portrait</b><span class="lbl">founder-portrait.png · radial blue glow</span></div>
  <div class="frame b"><img src="../assets/about-portrait.jpg" alt="About"/></div>
  <div class="stack"><b>About portrait</b><span class="lbl">about-portrait.jpg · 12px radius</span></div>
</div></body></html>
