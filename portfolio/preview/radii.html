<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 24px;display:flex;align-items:center;gap:18px;justify-content:space-around;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:64px;height:64px;background:linear-gradient(135deg,#2C323D,#1B2029);border:1px solid var(--border-default);}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);text-align:center;}
  .lbl b{color:var(--fg-primary);font-weight:600;}
</style></head>
<body><div class="stage">
  <div class="item"><div class="box" style="border-radius:4px;"></div><div class="lbl"><b>xs</b> · 4</div></div>
  <div class="item"><div class="box" style="border-radius:6px;"></div><div class="lbl"><b>sm</b> · 6</div></div>
  <div class="item"><div class="box" style="border-radius:8px;"></div><div class="lbl"><b>md</b> · 8</div></div>
  <div class="item"><div class="box" style="border-radius:12px;"></div><div class="lbl"><b>lg</b> · 12</div></div>
  <div class="item"><div class="box" style="border-radius:16px;"></div><div class="lbl"><b>xl</b> · 16</div></div>
  <div class="item"><div class="box" style="border-radius:24px;"></div><div class="lbl"><b>2xl</b> · 24</div></div>
  <div class="item"><div class="box" style="border-radius:9999px;"></div><div class="lbl"><b>full</b> · avatars</div></div>
</div></body></html>
