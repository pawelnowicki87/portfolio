<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;overflow:hidden;}
  .stage{padding:22px 24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:center;gap:14px;}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);min-width:110px;}
  .lbl b{color:var(--fg-primary);font-weight:600;}
  .track{flex:1;height:6px;background:var(--bg-sunken);border-radius:9999px;overflow:hidden;position:relative;}
  .dot{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--blue-500);box-shadow:0 0 0 4px rgba(59,130,246,.15);}
  @keyframes o { 0%{left:0;} 100%{left:calc(100% - 16px);} }
  @keyframes io { 0%{left:0;} 100%{left:calc(100% - 16px);} }
  @keyframes sp { 0%{left:0;} 100%{left:calc(100% - 16px);} }
  .ease-out .dot   { animation: o  1.6s cubic-bezier(0.22,1,0.36,1) infinite alternate; }
  .ease-io  .dot   { animation: io 1.6s cubic-bezier(0.65,0,0.35,1) infinite alternate; }
  .ease-sp  .dot   { animation: sp 1.6s cubic-bezier(0.34,1.56,0.64,1) infinite alternate; }
</style></head>
<body><div class="stage">
  <div class="row ease-out"><span class="lbl"><b>ease-out</b> · 140ms</span><div class="track"><div class="dot"></div></div></div>
  <div class="row ease-io"><span class="lbl"><b>ease-in-out</b> · 200ms</span><div class="track"><div class="dot"></div></div></div>
  <div class="row ease-sp"><span class="lbl"><b>ease-spring</b> · toasts</span><div class="track"><div class="dot"></div></div></div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);">durations · 80 · 140 · 200 · 320 ms</div>
</div></body></html>
