<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 28px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .label{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase;min-width:60px;}
  .meta{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);margin-left:auto;}
</style></head>
<body><div class="stage">
  <div class="row"><span class="label">H1 / 36</span><span style="font-size:36px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;">Workspace overview</span><span class="meta">600 · -0.02em</span></div>
  <div class="row"><span class="label">H2 / 28</span><span style="font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;">Recent activity</span><span class="meta">600 · -0.02em</span></div>
  <div class="row"><span class="label">H3 / 22</span><span style="font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;">Performance metrics</span><span class="meta">600 · -0.02em</span></div>
  <div class="row"><span class="label">H4 / 18</span><span style="font-size:18px;font-weight:600;line-height:1.3;">Settings panel</span><span class="meta">600 · 0</span></div>
</div></body></html>
