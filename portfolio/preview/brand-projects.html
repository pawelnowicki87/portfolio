<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:16px 18px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:120px;gap:10px;}
  .tile{position:relative;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default);background:var(--bg-sunken);}
  .tile img{width:100%;height:100%;object-fit:cover;}
  .cap{position:absolute;left:8px;bottom:8px;font-family:var(--font-mono);font-size:10px;color:#fff;background:rgba(8,9,12,.75);padding:2px 6px;border-radius:4px;}
</style></head>
<body><div class="stage">
  <div class="tile"><img src="../assets/projects/hematobieg.png" alt=""/><span class="cap">hematobieg</span></div>
  <div class="tile"><img src="../assets/projects/phone-catalog.png" alt=""/><span class="cap">phone-catalog</span></div>
  <div class="tile"><img src="../assets/projects/welcome-to-the-met.png" alt=""/><span class="cap">welcome-to-the-met</span></div>
  <div class="tile"><img src="../assets/projects/todo-app.png" alt=""/><span class="cap">todo-app</span></div>
  <div class="tile"><img src="../assets/projects/list-of-posts.jpg" alt=""/><span class="cap">list-of-posts</span></div>
  <div class="tile"><img src="../assets/projects/game-2048.png" alt=""/><span class="cap">game-2048</span></div>
</div></body></html>
