<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 24px;display:flex;flex-direction:column;gap:14px;}
  .legend{display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:2px;}
  svg{width:100%;height:120px;}
</style></head>
<body><div class="stage">
  <svg viewBox="0 0 660 120" preserveAspectRatio="none">
    <polyline points="0,80 60,72 120,76 180,55 240,60 300,42 360,48 420,30 480,38 540,22 600,28 660,15" stroke="#3B82F6" stroke-width="2" fill="none"/>
    <polyline points="0,95 60,90 120,86 180,82 240,75 300,72 360,68 420,60 480,58 540,50 600,45 660,40" stroke="#14B8A6" stroke-width="2" fill="none"/>
    <polyline points="0,100 60,98 120,92 180,95 240,88 300,90 360,82 420,78 480,80 540,72 600,70 660,68" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <polyline points="0,108 60,105 120,102 180,100 240,98 300,94 360,90 420,88 480,85 540,82 600,78 660,75" stroke="#EC4899" stroke-width="2" fill="none"/>
    <polyline points="0,112 60,110 120,108 180,106 240,103 300,100 360,98 420,95 480,93 540,90 600,88 660,85" stroke="#F59E0B" stroke-width="2" fill="none"/>
  </svg>
  <div class="legend">
    <span><i style="background:#3B82F6;"></i>blue · primary</span>
    <span><i style="background:#14B8A6;"></i>teal</span>
    <span><i style="background:#8B5CF6;"></i>violet</span>
    <span><i style="background:#EC4899;"></i>pink</span>
    <span><i style="background:#F59E0B;"></i>amber</span>
  </div>
</div></body></html>
