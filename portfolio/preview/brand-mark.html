<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:20px 24px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:32px;align-items:center;}
  .mark{font-size:32px;font-weight:700;letter-spacing:-0.04em;font-family:var(--font-sans);}
  .mark .ac{color:var(--blue-500);}
  .small{font-size:18px;}
  .stack{display:flex;flex-direction:column;}
  .role{font-size:11px;color:var(--fg-tertiary);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
  .swatch{width:46px;height:46px;border-radius:var(--radius-md);background:var(--blue-500);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;letter-spacing:-0.02em;}
</style></head>
<body><div class="stage">
  <div class="row">
    <div class="swatch">P</div>
    <div class="stack">
      <div class="mark"><span class="ac">P</span>aweł <span class="ac">N</span>owicki</div>
      <div class="role">primary logotype · sentence-set with brand-blue initials</div>
    </div>
  </div>
  <div class="row">
    <div class="mark small"><span class="ac">P</span>N</div>
    <div class="mark small"><span class="ac">P</span>aweł <span class="ac">N</span>owicki</div>
    <div class="stack"><div class="role">condensed mark · 18px in navbars</div></div>
  </div>
</div></body></html>
