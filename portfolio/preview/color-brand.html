<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .ramp{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;}
  .sw{height:64px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.06);}
  .row{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--fg-tertiary);font-family:var(--font-mono);}
</style></head>
<body><div class="stage">
  <div class="ramp">
    <div class="sw" style="background:#EEF4FF;color:#1E3A8A;">50</div>
    <div class="sw" style="background:#DCE7FF;color:#1E3A8A;">100</div>
    <div class="sw" style="background:#B6CDFF;color:#1E3A8A;">200</div>
    <div class="sw" style="background:#84ABFF;">300</div>
    <div class="sw" style="background:#5B8DFF;">400</div>
    <div class="sw" style="background:#3B82F6;outline:1px solid rgba(255,255,255,.25);">500★</div>
    <div class="sw" style="background:#2563EB;">600</div>
    <div class="sw" style="background:#1D4ED8;">700</div>
    <div class="sw" style="background:#1E3A8A;">900</div>
  </div>
  <div class="row"><span>brand · #3B82F6</span><span style="margin-left:auto;">primary actions · focus rings · links</span></div>
</div></body></html>
