<!doctype html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);height:100%;}
  .stage{padding:22px 24px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:18px;align-items:center;}
  .avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;color:#fff;font-size:13px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);position:relative;}
  .avatar.img{background:none;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .a-xs{width:20px;height:20px;font-size:9px;}
  .a-sm{width:28px;height:28px;font-size:11px;}
  .a-md{width:36px;height:36px;font-size:13px;}
  .a-lg{width:48px;height:48px;font-size:16px;}
  .a-xl{width:64px;height:64px;font-size:22px;}
  .status{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#10B981;border:2px solid var(--bg-canvas);}
  .group{display:flex;}
  .group .avatar{border:2px solid var(--bg-canvas);margin-left:-8px;}
  .group .avatar:first-child{margin-left:0;}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
</style></head>
<body><div class="stage">
  <div class="row">
    <div class="avatar a-xs">PN</div>
    <div class="avatar a-sm">PN</div>
    <div class="avatar a-md">PN</div>
    <div class="avatar a-lg">PN<span class="status"></span></div>
    <div class="avatar a-xl img"><img src="../assets/founder-portrait.png" alt=""/></div>
    <span class="lbl" style="margin-left:auto;">20 · 28 · 36 · 48 · 64</span>
  </div>
  <div class="row">
    <div class="group">
      <div class="avatar a-md" style="background:linear-gradient(135deg,#3B82F6,#8B5CF6);">PN</div>
      <div class="avatar a-md" style="background:linear-gradient(135deg,#10B981,#14B8A6);">AK</div>
      <div class="avatar a-md" style="background:linear-gradient(135deg,#F59E0B,#EF4444);">MS</div>
      <div class="avatar a-md" style="background:#232831;color:var(--fg-secondary);border:1px solid var(--border-default);">+4</div>
    </div>
    <span class="lbl" style="margin-left:auto;">stacked group · -8px overlap</span>
  </div>
</div></body></html>
