<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Marek Nowicki — Senior Full-Stack Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:   { 0: '#06070a', 50: '#0a0b0f', 100: '#0e1014', 200: '#14171d', 300: '#1c2027', 400: '#262b34', 500: '#363c47' },
          fog:   { 50: '#9ca0aa', 100: '#b8bcc6', 200: '#d4d7de' },
          violet:{ DEFAULT: '#a78bfa' },
          mint:  { DEFAULT: '#5eead4' },
          amber: { DEFAULT: '#fbbf24' },
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        boxShadow: {
          'glow-violet': '0 0 60px -10px rgba(167,139,250,0.35)',
          'glow-mint':   '0 0 60px -10px rgba(94,234,212,0.30)',
        }
      }
    }
  }
</script>
<style>
  html, body { background:#06070a; color:#e6e8ee; font-feature-settings: "ss01","cv11"; }
  ::selection { background: rgba(167,139,250,0.35); color:#fff; }

  /* hairline + dot grid */
  .hairline { background-image: linear-gradient(to right, rgba(255,255,255,0.06), rgba(255,255,255,0)); height:1px; }
  .grid-bg {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 0);
    background-size: 28px 28px;
  }
  .noise::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.04; mix-blend-mode:overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>");
  }
  /* glass card */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  .card-strong {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
  }
  .ring-violet { box-shadow: 0 0 0 1px rgba(167,139,250,0.35), 0 0 40px -8px rgba(167,139,250,0.45); }
  .ring-mint   { box-shadow: 0 0 0 1px rgba(94,234,212,0.35), 0 0 40px -8px rgba(94,234,212,0.45); }

  /* marquee */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { animation: marquee 40s linear infinite; }
  .marquee-track.reverse { animation-direction: reverse; animation-duration: 55s; }
  .marquee-fade { mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); }

  /* fade-rise */
  .reveal { opacity:0; transform: translateY(14px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity:1; transform: translateY(0); }

  /* pulse dot */
  @keyframes pulseDot { 0%{ box-shadow:0 0 0 0 rgba(94,234,212,0.45);} 70%{ box-shadow:0 0 0 10px rgba(94,234,212,0);} 100%{ box-shadow:0 0 0 0 rgba(94,234,212,0);} }
  .pulse-dot { animation: pulseDot 2.2s infinite; }

  /* gradient text */
  .grad-text {
    background: linear-gradient(180deg, #ffffff 0%, #b9bccb 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .grad-violet {
    background: linear-gradient(120deg, #c4b5fd 0%, #a78bfa 50%, #7c5cff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* shimmer button border */
  .btn-shimmer { position:relative; isolation:isolate; }
  .btn-shimmer::before {
    content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: conic-gradient(from var(--ang,0deg), rgba(167,139,250,0.0), rgba(167,139,250,0.7), rgba(94,234,212,0.4), rgba(167,139,250,0.0));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 5s linear infinite;
  }
  @keyframes spin { to { --ang: 360deg; transform: rotate(0); } }
  @property --ang { syntax:'<angle>'; initial-value:0deg; inherits:false; }

  /* timeline rail */
  .rail::before {
    content:""; position:absolute; left:11px; top:6px; bottom:6px; width:1px;
    background: linear-gradient(to bottom, rgba(167,139,250,0.5), rgba(255,255,255,0.05));
  }

  /* code chip */
  .chip { display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .55rem; border-radius:999px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.025); font-family: "JetBrains Mono", monospace; font-size: 11px; color:#b8bcc6; }

  /* hero canvas mask */
  .hero-canvas { mask-image: radial-gradient(ellipse at center, #000 50%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at center, #000 50%, transparent 75%); }

  /* link underline */
  .link-u { position:relative; }
  .link-u::after { content:""; position:absolute; left:0; right:0; bottom:-2px; height:1px; background:currentColor; transform: scaleX(0); transform-origin: left; transition: transform .4s ease; }
  .link-u:hover::after { transform: scaleX(1); }

  /* scrollbar */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#1c2027; border-radius:10px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* aurora */
  .aurora { position:absolute; inset:-20%; background:
    radial-gradient(40% 35% at 20% 30%, rgba(167,139,250,0.18), transparent 60%),
    radial-gradient(35% 30% at 80% 20%, rgba(94,234,212,0.12), transparent 60%),
    radial-gradient(45% 40% at 60% 80%, rgba(124,92,255,0.14), transparent 60%);
    filter: blur(20px); pointer-events:none;
  }
</style>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="hero3d.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
