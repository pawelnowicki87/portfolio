<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>Nowicki Engineering — Dashboard UI Kit</title>
<meta name="viewport" content="width=1280"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Overview.jsx"></script>
<script type="text/babel" src="Board.jsx"></script>
<script type="text/babel" src="Settings.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;
function App() {
  const [screen, setScreen] = useState('overview');
  const [dark, setDark] = useState(true);
  useEffect(() => { document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); }, [dark]);
  return (
    <div className="ds-app" data-screen-label={screen === 'overview' ? 'Dashboard Overview' : screen === 'board' ? 'Project Board' : 'Settings'}>
      <Sidebar screen={screen} setScreen={setScreen}/>
      <div className="ds-main">
        <TopBar screen={screen} darkMode={dark} setDarkMode={setDark}/>
        {screen === 'overview' && <Overview/>}
        {screen === 'board' && <Board/>}
        {screen === 'settings' && <Settings/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
