<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Paweł Nowicki — Full-Stack Engineer</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="texts.js"></script>
  <script type="text/babel" src="Navbar.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="About.jsx"></script>
  <script type="text/babel" src="Projects.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
</head>
<body data-screen-label="Portfolio · marketing site">
  <div id="root"></div>
  <script type="text/babel">
    const App = () => {
      const [darkMode, setDarkMode] = React.useState(true);
      const [language, setLanguage] = React.useState('en');
      React.useEffect(() => {
        document.documentElement.dataset.theme = darkMode ? 'dark' : 'light';
      }, [darkMode]);
      const t = window.portfolioTexts[language];
      return (
        <>
          <PortfolioNavbar t={t} language={language} setLanguage={setLanguage} darkMode={darkMode} setDarkMode={setDarkMode}/>
          <PortfolioHero t={t} language={language}/>
          <PortfolioAbout t={t}/>
          <PortfolioProjects t={t}/>
          <PortfolioContact t={t}/>
          <footer className="pf-footer">© {new Date().getFullYear()} Paweł Nowicki · Wrocław, Poland · Built with React + the Nowicki Engineering Design System</footer>
        </>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
